[main]
orig_preset_name = Arcade Cabinet
display_name = Arcade Cabinet
description = An arcade monitor in a dark room: coarse mask, bright glow, deep curve. Targets 4K output.
tags = PDM

[horizontal-scanlines]
mode = dynamic
saturation = 100
strength = 50
thickness = 45
glow = 45

[dynamic-scanlines]
profile = arcade
width_dark = 0.3
width_bright = 1
width_growth = natural
width_curve = 0.5
beam_edge = 2.2
energy_conserving = 100
halo = 0.1
halo_width = 2
phosphor_saturation = 0.5
bloom = on
highlight_knee = 0
width_follows = brightest

[analog-path]
aps_enable = off
aps_console = -
aps_connection = 0
aps_yc_crosstalk_pct = 15
aps_decoder = 0
aps_comb_sensitivity_pct = 50
aps_pal_delay_line = 1
aps_dot_crawl_locked = 0
aps_sharpness = 30
aps_luma_bw_dmhz = 35
aps_chroma_bw_cmhz = 80
aps_tint_deg = 0
aps_color_pct = 100
aps_edge_smear_pct = 0
aps_chroma_delay_ns = 0
aps_tv_black_dire = 0
aps_diff_phase_deg = 0
aps_diff_gain_pct = 0
aps_acc = 1
aps_killer = 0
aps_black_breathing = 0
aps_signal_strength_pct = 70
aps_ghost_pct = 0
aps_ghost_delay_dus = 15
aps_sound_beat = 20
aps_drift = 0
aps_fine_tuning = 0
aps_if_slope_pct = 0
aps_hue_jitter = 0
aps_cable_length = 0
aps_reflection = 0
aps_reflection_ns = 150
aps_tape = 0
aps_console_setup_dire = -
aps_chroma_wave = -
aps_output_clip = -
aps_enc_color_bw_dmhz = -
aps_artifact_phase_deg = -

[crt-blur]
enable = on
preset = 3
amount = 1
aps_blur_look = 1

[convergence]
enable = on
red = -20
blue = 0
corner = worn
corner_size = 16
corner_tilt = 8
horizontal_look = typical

[slotmask]
intensity = 0.25
conversion = none
damper_wires = off
data = <<EOF
vMFX
# mode: 1
# offset: 0,0

# w,h
12,4

# lut
0x800000,0x800000,0x008000,0x008000,0x000080,0x000080,0x800000,0x800000,0x008000,0x008000,0x000080,0x000080
0x800000,0x800000,0x008000,0x008000,0x000080,0x000080,0x000000,0x000000,0x000000,0x000000,0x000000,0x000000
0x800000,0x800000,0x008000,0x008000,0x000080,0x000080,0x800000,0x800000,0x008000,0x008000,0x000080,0x000080
0x000000,0x000000,0x000000,0x000000,0x000000,0x000000,0x800000,0x800000,0x008000,0x008000,0x000080,0x000080
EOF

[phosphor-glow]
phosphor_glow = on
glow_look = arcade
glow_strength = 14
glow_size_q = 10
glow_tint = 0
glow_dither = animated
glow_stops_at = picture_edge
room_light = -
edge_dimming = 3
dimming_shape = wide
room = -

[gamut-white-point]
gamut = on
gamut_look = us_tv
white_point = 6500k
phosphors = smptec
fit_to_display = on

[crt-curvature]
curvature = on
curvature_profile = arcade
curve_h = 16
side_bow = 16
curve_v = 21
corner_radius = 32
bezel_sides = 0
bezel_top_bottom = 0
window_shape = -
window_inset = -

[tube-sag]
tube_sag = on
tube_sag_look = normal
tube_breathing = 4
bright_line_bulge = 5
breathing_speed = normal
