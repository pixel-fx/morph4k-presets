[main]
orig_preset_name = Sony PVM-20M4U Composite
display_name = Sony PVM-20M4U Composite

[scaler]
horiz_kernel = soft

[horizontal-scanlines]
mode = dynamic
saturation = 100
strength = 50
thickness = 45
glow = 45

[dynamic-scanlines]
profile = pvm
width_dark = 0.3
width_bright = 0.5
width_growth = even
width_curve = 1.8
beam_edge = 2.4
energy_conserving = 100
halo = 0
halo_width = 1.6
phosphor_saturation = 0.3
bloom = on
highlight_knee = 70
width_follows = brightest

[analog-path]
aps_enable = on
aps_console = -
aps_connection = 0
aps_yc_crosstalk_pct = 0
aps_decoder = 3
aps_comb_sensitivity_pct = 50
aps_pal_delay_line = 1
aps_dot_crawl_locked = 0
aps_sharpness = 0
aps_luma_bw_dmhz = 60
aps_chroma_bw_cmhz = 60
aps_tint_deg = 0
aps_color_pct = 100
aps_edge_smear_pct = 100
aps_chroma_delay_ns = 0
aps_tv_black_dire = 75
aps_diff_phase_deg = 0
aps_diff_gain_pct = 0
aps_acc = 1
aps_killer = 1
aps_black_breathing = 0
aps_signal_strength_pct = 70
aps_ghost_pct = 0
aps_ghost_delay_dus = 15
aps_sound_beat = 20
aps_drift = 0
aps_fine_tuning = 0
aps_if_slope_pct = 0
aps_hue_jitter = 0
aps_cable_length = 0
aps_reflection = 0
aps_reflection_ns = 150
aps_tape = 0
aps_console_setup_dire = -
aps_chroma_wave = -
aps_output_clip = -
aps_enc_color_bw_dmhz = -
aps_artifact_phase_deg = -

[crt-blur]
enable = on
preset = 0
amount = 0.5
aps_blur_look = 0

[convergence]
enable = on
red = -10
blue = 10
corner = pvm
corner_size = 4
corner_tilt = 4
horizontal_look = none

[slotmask]
intensity = 0.5
conversion = none
damper_wires = off
mask_mode = physical
tube_preset = 4
tube_layout = grille
tube_size = 20
tube_pitch = fine
tube_size_mode = follow
tube_orientation = normal
data = <<EOF
vMFX
# mode: 1
# offset: 0,0

# w,h
3,3

# lut
0x800000,0x008000,0x000080
0x800000,0x008000,0x000080
0x800000,0x008000,0x000080
EOF

[phosphor-glow]
phosphor_glow = on
glow_look = clean
glow_strength = 6
glow_size_q = 3
glow_tint = 0
glow_dither = animated
glow_stops_at = bezel
room_light = 0
edge_dimming = 2
dimming_shape = wide
room = off

[gamut-white-point]
gamut = on
gamut_look = none
white_point = 6500k
phosphors = smptec
fit_to_display = on
tv_decoder = us_monitor

[crt-curvature]
curvature = on
curvature_profile = studio
curve_h = 0
side_bow = 0
curve_v = 9
corner_radius = 12
bezel_sides = 0
bezel_top_bottom = 9
bezel_bow_h = 0
bezel_bow_v = 0
window_shape = -
window_inset = -

[tube-sag]
tube_sag = on
tube_sag_look = none
tube_breathing = 3
bright_line_bulge = 3
breathing_speed = normal

[bezel]
bezel = off
bezel_reflection = off
retro_fx = on
crt_simulation = on
