[main]
orig_preset_name = Clean Scanlines
display_name = Clean Scanlines
description = Scanlines only, at full brightness. No mask, glow or curve.
tags = PDM

[horizontal-scanlines]
mode = dynamic
saturation = 100
strength = 50
thickness = 45
glow = 45

[dynamic-scanlines]
profile = gaussian
width_dark = 0.32
width_bright = 1
width_growth = even
width_curve = 0.5
beam_edge = 2
energy_conserving = 100
halo = 0
halo_width = 2
phosphor_saturation = 0
bloom = on
highlight_knee = 0
width_follows = brightest

[analog-path]
aps_enable = off
aps_console = -
aps_connection = 0
aps_yc_crosstalk_pct = 15
aps_decoder = 0
aps_comb_sensitivity_pct = 50
aps_pal_delay_line = 1
aps_dot_crawl_locked = 0
aps_sharpness = 30
aps_luma_bw_dmhz = 35
aps_chroma_bw_cmhz = 80
aps_tint_deg = 0
aps_color_pct = 100
aps_edge_smear_pct = 0
aps_chroma_delay_ns = 0
aps_tv_black_dire = 0
aps_diff_phase_deg = 0
aps_diff_gain_pct = 0
aps_acc = 1
aps_killer = 0
aps_black_breathing = 0
aps_signal_strength_pct = 70
aps_ghost_pct = 0
aps_ghost_delay_dus = 15
aps_sound_beat = 20
aps_drift = 0
aps_fine_tuning = 0
aps_if_slope_pct = 0
aps_hue_jitter = 0
aps_cable_length = 0
aps_reflection = 0
aps_reflection_ns = 150
aps_tape = 0
aps_console_setup_dire = -
aps_chroma_wave = -
aps_output_clip = -
aps_enc_color_bw_dmhz = -
aps_artifact_phase_deg = -

[crt-blur]
enable = off
preset = 0
amount = 1
aps_blur_look = 1

[convergence]
enable = off
red = 0
blue = 0
corner = off
corner_size = 0
corner_tilt = 0
horizontal_look = off

[slotmask]
intensity = 0.25
conversion = none
damper_wires = off
data = <<EOF
vMFX
# mode: 0
# offset: 0,0

# w,h
6,2

# lut
0x800000,0x800000,0x008000,0x008000,0x000080,0x000080
0x008000,0x000080,0x000080,0x800000,0x800000,0x008000
EOF

[phosphor-glow]
phosphor_glow = off
glow_look = clean
glow_strength = 6
glow_size_q = 3
glow_tint = 0
glow_dither = animated
glow_stops_at = picture_edge
room_light = -
edge_dimming = 0
dimming_shape = round
room = -

[gamut-white-point]
gamut = off
gamut_look = -
white_point = -
phosphors = -
fit_to_display = on

[crt-curvature]
curvature = off
curvature_profile = consumer
curve_h = 12
side_bow = 12
curve_v = 16
corner_radius = 24
bezel_sides = 0
bezel_top_bottom = 0
window_shape = -
window_inset = -

[tube-sag]
tube_sag = off
tube_sag_look = -
tube_breathing = -
bright_line_bulge = -
breathing_speed = -
